<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #141b22;
      --muted: #516173;
      --paper: #f5f7f9;
      --line: #d6dde5;
      --accent: #1d8f8a;
      --accent-strong: #126d69;
      --warm: #f4a63f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 10% 10%, #f7efe5 0%, #f5f7f9 40%, #edf2f7 100%);
    }
    .shell { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .topbar {
      background: linear-gradient(120deg, #123047, #1e5468 60%, #2f7d83);
      color: #fff;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 10px 28px rgba(18, 48, 71, 0.25);
    }
    .brand { font-family: "Space Grotesk", sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: .4px; }
    .nav { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a, .nav button {
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      background: rgba(255,255,255,.08);
      padding: 8px 12px;
      border-radius: 999px;
      text-decoration: none;
      font-size: .92rem;
      cursor: pointer;
    }
    .nav .active { background: #fff; color: #123047; border-color: #fff; font-weight: 700; }
    .panel {
      margin-top: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(17, 40, 61, 0.08);
    }
    h1, h2, h3 { font-family: "Space Grotesk", sans-serif; margin-top: 0; }
    .grid { display: grid; gap: 12px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 900px) { .grid.cols-2 { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 8px 0 4px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: .95rem;
      font-family: inherit;
      background: #fff;
    }
    textarea { min-height: 80px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.secondary { background: #344657; }
    .btn.warn { background: #b33d2f; }
    .muted { color: var(--muted); font-size: .9rem; }
    .message {
      background: #eef9f7;
      border: 1px solid #c8e7e4;
      color: #155e5a;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .tag { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #eef2f6; font-size: .78rem; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">{{ app_name }}</div>
      {% if current_user %}
      <div class="nav">
        <a href="/designer" class="{% if active_tab == 'designer' %}active{% endif %}">Designer</a>
        <a href="/devices" class="{% if active_tab == 'devices' %}active{% endif %}">Device Management</a>
        <a href="/integrations" class="{% if active_tab == 'integrations' %}active{% endif %}">Integrations</a>
        <a href="/docs">API Docs</a>
        <form method="post" action="/logout" style="margin:0">
          <button type="submit">Logout</button>
        </form>
      </div>
      {% endif %}
    </div>
    <div class="panel">
      {% if message %}<div class="message">{{ message }}</div>{% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
