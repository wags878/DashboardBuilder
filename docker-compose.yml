services:
  dashboard-manager:
    build:
      context: .
    image: dashboard-builder:latest
    container_name: dashboard-manager
    init: true
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/dashboard_builder.db}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-60}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped